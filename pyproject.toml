[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-studio-local"
version = "0.1.0"
description = "Local GUI and OpenAI-compatible controller for mlx-lm and mlx-vlm"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "huggingface-hub>=0.29,<2",
  "httpx>=0.27,<1",
  "mlx-lm>=0.31.3",
  "mlx-vlm>=0.7",
  "psutil>=6,<8",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
mlx-studio = "mlx_studio.app:main"

[tool.setuptools]
packages = ["mlx_studio"]

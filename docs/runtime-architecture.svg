<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">MLX Studio runtime architecture</title>
  <desc id="desc">Requests travel from OpenCode through the MLX Studio OpenAI-compatible proxy to either MLX LM or MLX VLM, while the controller manages model downloads and telemetry.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10313a"/>
      <stop offset="1" stop-color="#0d2029"/>
    </linearGradient>
    <linearGradient id="violetPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2141"/>
      <stop offset="1" stop-color="#171525"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#67e8f9"/>
    </marker>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="620" rx="28" fill="url(#background)"/>
  <path d="M0 142 H1200 M0 512 H1200" stroke="#ffffff" stroke-opacity=".06"/>
  <circle cx="1080" cy="82" r="110" fill="#22d3ee" fill-opacity=".035"/>
  <circle cx="1130" cy="540" r="170" fill="#a78bfa" fill-opacity=".035"/>

  <text x="64" y="72" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">MLX Studio runtime</text>
  <text x="64" y="108" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">One local control plane for models, OpenAI-compatible traffic, and performance telemetry.</text>

  <g transform="translate(64 205)">
    <rect width="220" height="166" rx="20" fill="#10151d" stroke="#ffffff" stroke-opacity=".12"/>
    <circle cx="34" cy="36" r="8" fill="#67e8f9" filter="url(#glow)"/>
    <text x="58" y="43" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="650">Clients</text>
    <text x="28" y="91" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="18">OpenCode</text>
    <text x="28" y="122" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15">OpenAI SDKs</text>
    <text x="28" y="148" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="14">/v1/chat/completions</text>
  </g>

  <g transform="translate(376 180)">
    <rect width="330" height="216" rx="22" fill="url(#cyanPanel)" stroke="#67e8f9" stroke-opacity=".42"/>
    <text x="28" y="48" fill="#cffafe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">MLX Studio controller</text>
    <rect x="28" y="72" width="274" height="40" rx="10" fill="#020617" fill-opacity=".48"/>
    <text x="45" y="98" fill="#a5f3fc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="15">OpenAI-compatible proxy</text>
    <rect x="28" y="122" width="132" height="62" rx="12" fill="#020617" fill-opacity=".38"/>
    <text x="44" y="148" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Lifecycle</text>
    <text x="44" y="169" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">start · stop · swap</text>
    <rect x="170" y="122" width="132" height="62" rx="12" fill="#020617" fill-opacity=".38"/>
    <text x="186" y="148" fill="#e2e8f0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Telemetry</text>
    <text x="186" y="169" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">TTFT · TPS · cache</text>
  </g>

  <g transform="translate(798 178)">
    <rect width="338" height="102" rx="20" fill="url(#violetPanel)" stroke="#a78bfa" stroke-opacity=".42"/>
    <text x="26" y="40" fill="#ede9fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700">MLX LM</text>
    <text x="26" y="69" fill="#a8a4b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Text models · prompt cache · LM drafting</text>
  </g>
  <g transform="translate(798 294)">
    <rect width="338" height="102" rx="20" fill="url(#violetPanel)" stroke="#a78bfa" stroke-opacity=".42"/>
    <text x="26" y="40" fill="#ede9fe" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700">MLX VLM</text>
    <text x="26" y="69" fill="#a8a4b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Vision + text · APC · DFlash / MTP</text>
  </g>

  <path d="M284 288 H366" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M706 249 H788" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M706 327 H788" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(64 464)">
    <rect width="1072" height="92" rx="18" fill="#ffffff" fill-opacity=".025" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="28" y="38" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Hugging Face cache</text>
    <text x="28" y="65" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Repository search · byte-level download progress · target and draft checkpoints</text>
    <text x="780" y="38" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Localhost only</text>
    <text x="780" y="65" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13">127.0.0.1:8111/v1</text>
  </g>
</svg>
